<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ TITLE }} | Cathal Coffey</title>
  <meta name="description" content="{{ SUBTITLE }}">
  <link rel="canonical" href="https://cathalcoffey.com/major-builds/{{ SLUG }}/">

  <!-- Security Headers -->
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; media-src 'self'; connect-src 'self' https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com;">

  <!-- OpenGraph / Facebook -->
  <meta property="og:type" content="article">
  <meta property="og:site_name" content="Cathal Coffey">
  <meta property="og:title" content="{{ TITLE }} | Cathal Coffey">
  <meta property="og:description" content="{{ SUBTITLE }}">
  <meta property="og:url" content="https://cathalcoffey.com/major-builds/{{ SLUG }}/">
  <meta property="og:image" content="{{ OG_IMAGE_URL }}">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{ TITLE }} | Cathal Coffey">
  <meta name="twitter:description" content="{{ SUBTITLE }}">
  <meta name="twitter:image" content="{{ OG_IMAGE_URL }}">

  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="stylesheet" href="/css/style.css?v={{ BUILD_ID }}">
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id={{ GA_MEASUREMENT_ID }}"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', '{{ GA_MEASUREMENT_ID }}', {
      'project_title': '{{ TITLE }}',
      'project_slug': '{{ SLUG }}',
      'build_type': 'major'
    });
  </script>
</head>
<body>
  <nav class="top-nav">
    <div class="container nav-inner">
      <button class="nav-menu-toggle" type="button" aria-expanded="false" aria-controls="site-navigation">
        <span>Menu</span>
        <svg class="nav-menu-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <path d="M4 7h16"></path>
          <path d="M4 12h16"></path>
          <path d="M4 17h16"></path>
        </svg>
      </button>
      <div class="nav-links" id="site-navigation">
        {{ NAV_LINKS }}
      </div>
    </div>
  </nav>

  <div class="container">
    <header class="build-header-full">
      <h1 class="build-heading">{{ TITLE }}</h1>
      <p class="build-sub">{{ SUBTITLE }}</p>
      <div class="tag-row">
        {{ TAGS }}
      </div>
    </header>

    {{ HERO_SECTION }}

    {{ STORY_SECTION }}

    {{ NEXT_STEPS_SECTION }}

    <div class="gallery-header">
      <div class="gallery-title">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
        <span>Build Gallery</span>
      </div>
      <span class="gallery-subtitle">{{ GALLERY_SUMMARY }}</span>
    </div>

    <div class="photo-grid">
      {{ PHOTO_GRID }}
    </div>
  </div>

  <div id="lightbox" class="lightbox" aria-hidden="true" onclick="handleBackdropClick(event)">
    <div class="lightbox-backdrop"></div>
    <button class="lightbox-btn lightbox-close" onclick="closeLightbox()" aria-label="Close">&times;</button>
    <button class="lightbox-btn lightbox-fullscreen" id="lightboxFullscreenBtn" onclick="toggleLightboxFullscreen()" aria-label="Toggle Fullscreen">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
    </button>
    <button class="lightbox-btn lightbox-zoom" id="lightboxZoomBtn" onclick="toggleLightboxZoom()" aria-label="Zoom Photo">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line><line x1="11" y1="8" x2="11" y2="14"></line><line x1="8" y1="11" x2="14" y2="11"></line></svg>
    </button>
    <button class="lightbox-btn lightbox-prev" onclick="prevLightbox(event)" aria-label="Previous">&lsaquo;</button>
    <button class="lightbox-btn lightbox-next" onclick="nextLightbox(event)" aria-label="Next">&rsaquo;</button>
    <div class="lightbox-stage">
      <img id="lightbox-img" class="lightbox-img" src="" alt="Enlarged build photo">
      <video id="lightbox-video" class="lightbox-video" controls preload="metadata" playsinline hidden></video>
    </div>
    <div class="lightbox-caption">
      <span id="lightbox-title"></span>
      <span>&bull;</span>
      <span id="lightbox-date"></span>
      <span class="lightbox-counter" id="lightbox-counter"></span>
    </div>
  </div>

  <script>
    function toggleNarrative() {
      const container = document.getElementById("narrativeCollapsible");
      const text = document.getElementById("narrativeToggleText");
      const icon = document.getElementById("narrativeToggleIcon");
      if (!container) return;
      const isExpanded = container.classList.toggle("expanded");
      if (text) text.textContent = isExpanded ? "Collapse story" : "Read full story";
      if (icon) {
        icon.style.transform = isExpanded ? "rotate(180deg)" : "rotate(0deg)";
      }
      if (isExpanded && typeof gtag === 'function') {
        gtag('event', 'read_story', {
          project_title: "{{ TITLE }}",
          project_slug: "{{ SLUG }}"
        });
      }
      if (!isExpanded) {
        const box = container.closest('.narrative-box');
        if (box && box.getBoundingClientRect().top < 80) {
          box.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
      }
    }

    window.addEventListener("DOMContentLoaded", () => {
      const container = document.getElementById("narrativeCollapsible");
      const content = document.getElementById("narrativeContent");
      const toggleWrap = document.getElementById("narrativeToggleWrap");
      const fade = document.getElementById("narrativeFade");
      if (content && container) {
        const isDesktopSplit = container.closest('.hero-split-container') && window.innerWidth > 860;
        const threshold = isDesktopSplit ? 530 : 180;
        if (content.scrollHeight <= threshold + 25) {
          container.classList.add("expanded");
          if (fade) fade.style.display = "none";
          if (toggleWrap) toggleWrap.style.display = "none";
        }
      }

      const initialIdx = findGalleryIndexFromHash(window.location.hash);
      if (initialIdx !== -1) {
        openLightbox(initialIdx, false);
      }
    });

    const gallery = {{ GALLERY_JSON }};
    let currentIndex = 0;
    let lightboxImageRequestId = 0;

    const lightbox = document.getElementById("lightbox");
    const lightboxImg = document.getElementById("lightbox-img");
    const lightboxVideo = document.getElementById("lightbox-video");
    const lightboxTitle = document.getElementById("lightbox-title");
    const lightboxDate = document.getElementById("lightbox-date");
    const lightboxCounter = document.getElementById("lightbox-counter");
    const lightboxZoomBtn = document.getElementById("lightboxZoomBtn");
    const lightboxFullscreenBtn = document.getElementById("lightboxFullscreenBtn");

    let isZoomed = false;
    let isPanning = false;
    let panStartX = 0;
    let panStartY = 0;
    let panTranslateX = 0;
    let panTranslateY = 0;

    // Zoom & Pan state (Mouse + Touch)
    let dragDistance = 0;
    let currentScale = 1;
    let initialPinchDistance = null;
    let initialPinchScale = 1;

    function applyTransform() {
      if (currentScale > 1) {
        lightboxImg.classList.add("is-zoomed");
        lightboxImg.style.transform = `scale(${currentScale}) translate(${panTranslateX / currentScale}px, ${panTranslateY / currentScale}px)`;
        if (lightboxZoomBtn) {
          lightboxZoomBtn.setAttribute("aria-label", "Zoom out");
          lightboxZoomBtn.innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line><line x1="8" y1="11" x2="14" y2="11"></line></svg>';
        }
      } else {
        resetZoom();
      }
    }

    function resetZoom() {
      isZoomed = false;
      isPanning = false;
      currentScale = 1;
      panTranslateX = 0;
      panTranslateY = 0;
      initialPinchDistance = null;
      if (lightboxImg) {
        lightboxImg.classList.remove("is-zoomed", "is-panning");
        lightboxImg.style.transform = "";
      }
      if (lightboxZoomBtn) {
        lightboxZoomBtn.setAttribute("aria-label", "Zoom in");
        lightboxZoomBtn.innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line><line x1="11" y1="8" x2="11" y2="14"></line><line x1="8" y1="11" x2="14" y2="11"></line></svg>';
      }
    }

    function toggleLightboxZoom(e) {
      if (e) e.stopPropagation();
      const item = gallery[currentIndex];
      if (!item || item.type === 'video') return;
      if (currentScale > 1) {
        resetZoom();
      } else {
        isZoomed = true;
        currentScale = 2.4;
        panTranslateX = 0;
        panTranslateY = 0;
        applyTransform();
      }
    }

    function toggleLightboxFullscreen(e) {
      if (e) e.stopPropagation();
      if (!document.fullscreenElement) {
        if (lightbox.requestFullscreen) {
          lightbox.requestFullscreen().catch(() => {});
        } else if (lightbox.webkitRequestFullscreen) {
          lightbox.webkitRequestFullscreen();
        }
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen().catch(() => {});
        } else if (document.webkitExitFullscreen) {
          document.webkitExitFullscreen();
        }
      }
    }

    // Mouse drag panning
    lightboxImg.addEventListener("mousedown", (e) => {
      dragDistance = 0;
      if (currentScale <= 1) return;
      e.preventDefault();
      isPanning = true;
      lightboxImg.classList.add("is-panning");
      panStartX = e.clientX - panTranslateX;
      panStartY = e.clientY - panTranslateY;
    });

    window.addEventListener("mousemove", (e) => {
      if (!isPanning || currentScale <= 1) return;
      e.preventDefault();
      const newX = (e.clientX - panStartX);
      const newY = (e.clientY - panStartY);
      dragDistance += Math.abs(newX - panTranslateX) + Math.abs(newY - panTranslateY);
      panTranslateX = newX;
      panTranslateY = newY;
      applyTransform();
    });

    window.addEventListener("mouseup", () => {
      if (isPanning) {
        isPanning = false;
        lightboxImg.classList.remove("is-panning");
      }
    });

    lightboxImg.addEventListener("click", (e) => {
      if (dragDistance > 6) return;
      toggleLightboxZoom(e);
    });

    // Touch handlers for Pinch-to-Zoom and 1-finger Pan
    let touchPanStartX = 0;
    let touchPanStartY = 0;
    let isTouchPanning = false;

    function getTouchDistance(touches) {
      const dx = touches[0].clientX - touches[1].clientX;
      const dy = touches[0].clientY - touches[1].clientY;
      return Math.sqrt(dx * dx + dy * dy);
    }

    lightboxImg.addEventListener("touchstart", (e) => {
      if (e.touches.length === 2) {
        // Pinch gesture starting
        initialPinchDistance = getTouchDistance(e.touches);
        initialPinchScale = currentScale;
        isTouchPanning = false;
      } else if (e.touches.length === 1 && currentScale > 1) {
        // 1-finger pan while zoomed in
        isTouchPanning = true;
        touchPanStartX = e.touches[0].clientX - panTranslateX;
        touchPanStartY = e.touches[0].clientY - panTranslateY;
      }
    }, {passive: false});

    lightboxImg.addEventListener("touchmove", (e) => {
      if (e.touches.length === 2 && initialPinchDistance) {
        e.preventDefault();
        const dist = getTouchDistance(e.touches);
        const factor = dist / initialPinchDistance;
        currentScale = Math.min(Math.max(initialPinchScale * factor, 1), 4);
        isZoomed = (currentScale > 1);
        applyTransform();
      } else if (e.touches.length === 1 && isTouchPanning && currentScale > 1) {
        e.preventDefault();
        panTranslateX = e.touches[0].clientX - touchPanStartX;
        panTranslateY = e.touches[0].clientY - touchPanStartY;
        applyTransform();
      }
    }, {passive: false});

    lightboxImg.addEventListener("touchend", (e) => {
      if (e.touches.length < 2) {
        initialPinchDistance = null;
      }
      if (e.touches.length === 0) {
        isTouchPanning = false;
        if (currentScale < 1.05) {
          resetZoom();
        }
      }
    }, {passive: true});

    function findGalleryIndexFromHash(hash) {
      if (!hash || hash.length <= 1) return -1;
      const raw = decodeURIComponent(hash.slice(1)).trim().toLowerCase();
      let idx = gallery.findIndex(item => item.filename && item.filename.toLowerCase() === raw);
      if (idx !== -1) return idx;
      idx = gallery.findIndex(item => {
        if (!item.filename) return false;
        const base = item.filename.replace(/\.[^/.]+$/, '').toLowerCase();
        return base === raw;
      });
      return idx;
    }

    function syncHashToItem(item, push = false) {
      if (!item || !item.filename) return;
      const targetHash = '#' + encodeURIComponent(item.filename);
      if (window.location.hash !== targetHash) {
        if (push) {
          history.pushState({ lightbox: true, filename: item.filename }, "", targetHash);
        } else {
          history.replaceState({ lightbox: true, filename: item.filename }, "", targetHash);
        }
      }
    }

    function openLightbox(index, updateHistory = true) {
      if (index < 0 || index >= gallery.length) return;
      currentIndex = index;
      updateLightboxContent();
      lightbox.classList.add("active");
      lightbox.setAttribute("aria-hidden", "false");
      document.body.style.overflow = "hidden";

      if (updateHistory) {
        syncHashToItem(gallery[index], true);
      }

      if (typeof gtag === 'function') {
        const item = gallery[index];
        gtag('event', 'view_gallery_item', {
          project_title: "{{ TITLE }}",
          project_slug: "{{ SLUG }}",
          media_filename: item.filename,
          media_type: item.type,
          media_index: index,
          media_date: item.date
        });
      }
    }

    function closeLightbox(updateHistory = true) {
      resetZoom();
      lightboxImageRequestId++;
      lightbox.classList.remove("active");
      lightbox.setAttribute("aria-hidden", "true");
      document.body.style.overflow = "";
      lightboxImg.classList.remove("is-loading");
      lightboxImg.src = "";
      lightboxImg.hidden = false;
      lightboxVideo.pause();
      lightboxVideo.removeAttribute("src");
      lightboxVideo.removeAttribute("poster");
      lightboxVideo.load();
      lightboxVideo.hidden = true;

      if (updateHistory && window.location.hash) {
        history.replaceState(null, "", window.location.pathname + window.location.search);
      }
    }

    function handleBackdropClick(e) {
      if (e.target.classList.contains("lightbox-backdrop") || e.target.classList.contains("lightbox")) {
        closeLightbox();
      }
    }

    function preloadGalleryImage(index) {
      if (index < 0 || index >= gallery.length) return;
      const item = gallery[index];
      const previewSrc = item.thumb_webp || item.thumb || item.full;
      const previewImage = new Image();
      previewImage.src = previewSrc;
      if (item.type !== "video" && item.full !== previewSrc) {
        const fullImage = new Image();
        fullImage.src = item.full;
      }
    }

    function updateLightboxContent() {
      resetZoom();
      const item = gallery[currentIndex];
      const requestedIndex = currentIndex;
      const requestId = ++lightboxImageRequestId;
      const previewSrc = item.thumb_webp || item.thumb || item.full;

      lightboxTitle.textContent = "{{ TITLE }}";
      lightboxDate.textContent = item.date;
      const mediaLabel = item.type === "video" ? "Video" : "Photo";
      lightboxCounter.textContent = `${mediaLabel} ${currentIndex + 1} of ${gallery.length}`;

      if (lightboxZoomBtn) {
        lightboxZoomBtn.style.display = item.type === "video" ? "none" : "";
      }

      lightboxImg.onload = null;
      lightboxImg.onerror = null;
      lightboxImg.classList.remove("is-loading");

      if (item.type === "video") {
        lightboxImg.hidden = true;
        lightboxImg.src = "";
        lightboxVideo.hidden = false;
        if (item.aspect_ratio) {
          lightboxVideo.style.setProperty("--ar", item.aspect_ratio);
          lightboxVideo.style.aspectRatio = item.aspect_ratio;
        } else {
          lightboxVideo.style.removeProperty("--ar");
          lightboxVideo.style.aspectRatio = "";
        }
        lightboxVideo.poster = item.thumb || "";
        if (lightboxVideo.src !== item.full && !lightboxVideo.src.endsWith(item.full)) {
          lightboxVideo.src = item.full;
          lightboxVideo.load();
        }
        const playPromise = lightboxVideo.play();
        if (playPromise !== undefined) {
          playPromise.catch(() => {});
        }
        preloadGalleryImage(currentIndex + 1);
        preloadGalleryImage(currentIndex - 1);
        return;
      }

      lightboxVideo.hidden = true;
      lightboxVideo.pause();
      lightboxVideo.removeAttribute("src");
      lightboxVideo.removeAttribute("poster");
      lightboxVideo.load();

      lightboxImg.hidden = false;
      lightboxImg.alt = `{{ TITLE }} build photo ${currentIndex + 1}`;

      // Lock aspect-ratio so thumbnail preview and full image share the exact same bounds
      if (item.aspect_ratio) {
        lightboxImg.style.setProperty("--ar", item.aspect_ratio);
        lightboxImg.style.aspectRatio = item.aspect_ratio;
      } else {
        lightboxImg.style.removeProperty("--ar");
        lightboxImg.style.aspectRatio = "";
      }

      // Swap to the small gallery image immediately. This keeps the image and
      // caption in sync even when someone advances faster than the full-size
      // photos can download.
      lightboxImg.classList.add("is-loading");
      lightboxImg.onload = () => {
        if (requestId === lightboxImageRequestId) {
          lightboxImg.classList.remove("is-loading");
        }
      };
      lightboxImg.onerror = () => {
        if (requestId === lightboxImageRequestId) {
          lightboxImg.classList.remove("is-loading");
        }
      };
      lightboxImg.src = previewSrc;
      if (lightboxImg.complete && lightboxImg.naturalWidth > 0) {
        lightboxImg.classList.remove("is-loading");
      }

      if (item.full !== previewSrc) {
        const fullImage = new Image();
        fullImage.decoding = "async";
        fullImage.onload = () => {
          if (requestId !== lightboxImageRequestId || requestedIndex !== currentIndex) return;
          lightboxImg.onload = null;
          lightboxImg.onerror = null;
          lightboxImg.src = item.full;
          lightboxImg.classList.remove("is-loading");
        };
        fullImage.src = item.full;
      }

      preloadGalleryImage(currentIndex + 1);
      preloadGalleryImage(currentIndex - 1);
    }

    function nextLightbox(e) {
      if (e) e.stopPropagation();
      if (gallery.length === 0) return;
      currentIndex = (currentIndex + 1) % gallery.length;
      updateLightboxContent();
      syncHashToItem(gallery[currentIndex], false);

      if (typeof gtag === 'function') {
        const item = gallery[currentIndex];
        gtag('event', 'view_gallery_item', {
          project_title: "{{ TITLE }}",
          project_slug: "{{ SLUG }}",
          media_filename: item.filename,
          media_type: item.type,
          media_index: currentIndex,
          media_date: item.date,
          nav_method: 'next'
        });
      }
    }

    function prevLightbox(e) {
      if (e) e.stopPropagation();
      if (gallery.length === 0) return;
      currentIndex = (currentIndex - 1 + gallery.length) % gallery.length;
      updateLightboxContent();
      syncHashToItem(gallery[currentIndex], false);

      if (typeof gtag === 'function') {
        const item = gallery[currentIndex];
        gtag('event', 'view_gallery_item', {
          project_title: "{{ TITLE }}",
          project_slug: "{{ SLUG }}",
          media_filename: item.filename,
          media_type: item.type,
          media_index: currentIndex,
          media_date: item.date,
          nav_method: 'prev'
        });
      }
    }

    window.addEventListener("popstate", () => {
      const idx = findGalleryIndexFromHash(window.location.hash);
      if (idx !== -1) {
        openLightbox(idx, false);
      } else if (lightbox.classList.contains("active")) {
        closeLightbox(false);
      }
    });

    document.addEventListener("keydown", (e) => {
      if (!lightbox.classList.contains("active")) return;
      if (e.key === "Escape") closeLightbox();
      if (e.key === "ArrowRight") nextLightbox();
      if (e.key === "ArrowLeft") prevLightbox();
      if (e.key === "z" || e.key === "Z") toggleLightboxZoom();
      if (e.key === "f" || e.key === "F") toggleLightboxFullscreen();
    });

    let touchStartX = 0;
    lightbox.addEventListener("touchstart", (e) => {
      touchStartX = e.changedTouches[0].screenX;
    }, {passive: true});
    lightbox.addEventListener("touchend", (e) => {
      // Do not navigate while zoomed in so touch panning works without jumping photos
      if (currentScale > 1.05) return;
      const touchEndX = e.changedTouches[0].screenX;
      if (touchEndX < touchStartX - 50) nextLightbox();
      if (touchEndX > touchStartX + 50) prevLightbox();
    }, {passive: true});

    lightboxVideo.addEventListener('play', () => {
      const item = gallery[currentIndex];
      if (item && item.type === 'video' && typeof gtag === 'function') {
        gtag('event', 'play_gallery_video', {
          project_title: "{{ TITLE }}",
          project_slug: "{{ SLUG }}",
          video_filename: item.filename,
          media_index: currentIndex
        });
      }
    });

    // GA4 Event Tracking: Hero video plays
    const heroVid = document.querySelector('.hero-portrait-player, .video-actual-player');
    if (heroVid) {
      heroVid.addEventListener('play', () => {
        if (typeof gtag === 'function') {
          gtag('event', 'play_hero_video', {
            project_title: "{{ TITLE }}",
            project_slug: "{{ SLUG }}",
            video_url: heroVid.currentSrc || ''
          });
        }
      });
    }
  </script>
  <script src="/js/navigation.js?v={{ BUILD_ID }}"></script>
</body>
</html>
