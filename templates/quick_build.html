<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ TITLE }} | Cathal Coffey</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="stylesheet" href="/css/style.css?v={{ BUILD_ID }}">
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id={{ GA_MEASUREMENT_ID }}"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', '{{ GA_MEASUREMENT_ID }}');
  </script>
</head>
<body>
  <nav class="top-nav">
    <div class="container nav-inner">
      <a href="/" class="nav-brand">
        <span class="brand-name">Cathal Coffey</span>
      </a>
      <div class="nav-links">
        {{ NAV_LINKS }}
      </div>
    </div>
  </nav>

  <div class="container">
    <header class="build-header-full">
      <h1 class="build-heading">{{ TITLE }}</h1>
      <p class="build-sub">{{ SUBTITLE }}</p>
      <div class="tag-row">
        {{ TAGS }}
      </div>
      {{ DESCRIPTION }}
    </header>

    <div class="gallery-header">
      <div class="gallery-title">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
        <span>Photos</span>
      </div>
      <span class="gallery-subtitle">{{ PHOTO_COUNT }} Photos</span>
    </div>

    <div class="photo-grid">
      {{ PHOTO_GRID }}
    </div>
  </div>

  <div id="lightbox" class="lightbox" aria-hidden="true" onclick="handleBackdropClick(event)">
    <div class="lightbox-backdrop"></div>
    <button class="lightbox-btn lightbox-close" onclick="closeLightbox()" aria-label="Close">&times;</button>
    <button class="lightbox-btn lightbox-prev" onclick="prevLightbox(event)" aria-label="Previous">&lsaquo;</button>
    <button class="lightbox-btn lightbox-next" onclick="nextLightbox(event)" aria-label="Next">&rsaquo;</button>
    <div class="lightbox-stage">
      <img id="lightbox-img" class="lightbox-img" src="" alt="Enlarged build photo">
      <div class="lightbox-caption">
        <span id="lightbox-title"></span>
        <span>&bull;</span>
        <span id="lightbox-date"></span>
        <span class="lightbox-counter" id="lightbox-counter"></span>
      </div>
    </div>
  </div>

  <script>
    const gallery = {{ GALLERY_JSON }};
    let currentIndex = 0;

    const lightbox = document.getElementById("lightbox");
    const lightboxImg = document.getElementById("lightbox-img");
    const lightboxTitle = document.getElementById("lightbox-title");
    const lightboxDate = document.getElementById("lightbox-date");
    const lightboxCounter = document.getElementById("lightbox-counter");

    function openLightbox(index) {
      if (index < 0 || index >= gallery.length) return;
      currentIndex = index;
      updateLightboxContent();
      lightbox.classList.add("active");
      lightbox.setAttribute("aria-hidden", "false");
      document.body.style.overflow = "hidden";

      if (typeof gtag === 'function') {
        const item = gallery[index];
        gtag('event', 'view_photo', {
          project_title: "{{ TITLE }}",
          photo_filename: item.filename,
          photo_index: index,
          photo_date: item.date
        });
      }
    }

    function closeLightbox() {
      lightbox.classList.remove("active");
      lightbox.setAttribute("aria-hidden", "true");
      document.body.style.overflow = "";
      lightboxImg.src = "";
    }

    function handleBackdropClick(e) {
      if (e.target.classList.contains("lightbox-backdrop") || e.target.classList.contains("lightbox")) {
        closeLightbox();
      }
    }

    function updateLightboxContent() {
      const item = gallery[currentIndex];
      lightboxImg.src = item.full;
      lightboxTitle.textContent = "{{ TITLE }}";
      lightboxDate.textContent = item.date;
      lightboxCounter.textContent = `Photo ${currentIndex + 1} of ${gallery.length}`;

      if (currentIndex + 1 < gallery.length) {
        const nextImg = new Image();
        nextImg.src = gallery[currentIndex + 1].full;
      }
      if (currentIndex - 1 >= 0) {
        const prevImg = new Image();
        prevImg.src = gallery[currentIndex - 1].full;
      }
    }

    function nextLightbox(e) {
      if (e) e.stopPropagation();
      if (gallery.length === 0) return;
      currentIndex = (currentIndex + 1) % gallery.length;
      updateLightboxContent();

      if (typeof gtag === 'function') {
        const item = gallery[currentIndex];
        gtag('event', 'view_photo', {
          project_title: "{{ TITLE }}",
          photo_filename: item.filename,
          photo_index: currentIndex,
          photo_date: item.date,
          nav_method: 'next'
        });
      }
    }

    function prevLightbox(e) {
      if (e) e.stopPropagation();
      if (gallery.length === 0) return;
      currentIndex = (currentIndex - 1 + gallery.length) % gallery.length;
      updateLightboxContent();

      if (typeof gtag === 'function') {
        const item = gallery[currentIndex];
        gtag('event', 'view_photo', {
          project_title: "{{ TITLE }}",
          photo_filename: item.filename,
          photo_index: currentIndex,
          photo_date: item.date,
          nav_method: 'prev'
        });
      }
    }

    document.addEventListener("keydown", (e) => {
      if (!lightbox.classList.contains("active")) return;
      if (e.key === "Escape") closeLightbox();
      if (e.key === "ArrowRight") nextLightbox();
      if (e.key === "ArrowLeft") prevLightbox();
    });

    let touchStartX = 0;
    lightbox.addEventListener("touchstart", (e) => {
      touchStartX = e.changedTouches[0].screenX;
    }, {passive: true});
    lightbox.addEventListener("touchend", (e) => {
      const touchEndX = e.changedTouches[0].screenX;
      if (touchEndX < touchStartX - 50) nextLightbox();
      if (touchEndX > touchStartX + 50) prevLightbox();
    }, {passive: true});

    document.querySelectorAll('.nav-dropdown-trigger').forEach(trigger => {
      trigger.addEventListener('click', (e) => {
        if (window.innerWidth <= 860) {
          e.preventDefault();
          const dropdown = trigger.closest('.nav-dropdown');
          const wasOpen = dropdown.classList.contains('is-open');
          document.querySelectorAll('.nav-dropdown.is-open').forEach(d => d.classList.remove('is-open'));
          if (!wasOpen) dropdown.classList.add('is-open');
        }
      });
    });
    document.addEventListener('click', (e) => {
      if (!e.target.closest('.nav-dropdown')) {
        document.querySelectorAll('.nav-dropdown.is-open').forEach(d => d.classList.remove('is-open'));
      }
    });
  </script>
</body>
</html>
