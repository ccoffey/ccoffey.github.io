name: Deploy site to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Lint GitHub Actions workflows
        uses: rhysd/actionlint@v1.7.12

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install --yes ffmpeg

      - name: Install Python dependencies
        run: python -m pip install --requirement requirements-test.txt

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Lint Python
        run: python -m ruff check .

      - name: Lint JavaScript and CSS
        run: npm run lint:js && npm run lint:css

      - name: Validate project media
        run: python scripts/validate_project_media.py

      - name: Build isolated site
        env:
          BUILD_ID: ${{ github.sha }}
          SITE_URL: ${{ vars.SITE_URL }}
          GA_MEASUREMENT_ID: ${{ vars.GA_MEASUREMENT_ID }}
        run: python scripts/build_site.py --output _site

      - name: Check performance budgets
        run: python scripts/check_performance.py _site

      - name: Validate generated HTML
        run: npm run lint:html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  browser-regression:
    needs: build
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright/python:v1.55.0-noble
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install media processing dependency
        run: apt-get update && apt-get install --yes ffmpeg

      - name: Install Python dependencies
        run: python -m pip install --requirement requirements-test.txt

      - name: Build isolated site
        env:
          BUILD_ID: ${{ github.sha }}
          SITE_URL: ${{ vars.SITE_URL }}
          GA_MEASUREMENT_ID: ${{ vars.GA_MEASUREMENT_ID }}
        run: python scripts/build_site.py --output _site

      - name: Check performance budgets
        run: python scripts/check_performance.py _site

      - name: Run browser regression tests
        env:
          SITE_ROOT: _site
        run: python tests/test_browser.py

      - name: Upload visual test artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: visual-test-artifacts
          path: test-results/visual
          if-no-files-found: ignore
          retention-days: 7

  deploy:
    needs: [build, browser-regression]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
