name: Build site preview

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Lint GitHub Actions workflows
        uses: rhysd/actionlint@v1.7.12

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install --yes ffmpeg

      - name: Install Python dependencies
        run: python -m pip install --requirement requirements-test.txt

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Lint Python
        run: python -m ruff check .

      - name: Lint JavaScript and CSS
        run: npm run lint:js && npm run lint:css

      - name: Validate changed project media
        run: python scripts/validate_project_media.py --base "origin/${{ github.base_ref || 'master' }}"

      - name: Build isolated site
        env:
          BUILD_ID: ${{ github.sha }}
          SITE_URL: ${{ vars.SITE_URL }}
          GA_MEASUREMENT_ID: ${{ vars.GA_MEASUREMENT_ID }}
        run: python scripts/build_site.py --output _site

      - name: Check performance budgets
        run: python scripts/check_performance.py _site

      - name: Validate generated HTML
        run: npm run lint:html

      - name: Create content manifest
        run: python scripts/site_manifest.py create _site "${{ runner.temp }}/site-manifest.json"

      - name: Rebuild site independently
        env:
          BUILD_ID: ${{ github.sha }}
          SITE_URL: ${{ vars.SITE_URL }}
          GA_MEASUREMENT_ID: ${{ vars.GA_MEASUREMENT_ID }}
        run: python scripts/build_site.py --output "${{ runner.temp }}/site-repeat"

      - name: Verify reproducible output
        run: python scripts/site_manifest.py verify "${{ runner.temp }}/site-repeat" "${{ runner.temp }}/site-manifest.json"

      # Shadow mode only: upload the audit surface, not 555 MiB of duplicated media.
      - name: Upload site audit
        uses: actions/upload-artifact@v7
        with:
          name: site-audit
          path: |
            _site/**/*.html
            _site/css/**
            _site/js/**
            _site/CNAME
            _site/.nojekyll
            ${{ runner.temp }}/site-manifest.json
          include-hidden-files: true
          retention-days: 3
          if-no-files-found: error

  browser-regression:
    needs: build-preview
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright/python:v1.55.0-noble
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install media processing dependency
        run: apt-get update && apt-get install --yes ffmpeg

      - name: Install Python dependencies
        run: python -m pip install --requirement requirements-test.txt

      - name: Build isolated site
        env:
          BUILD_ID: ${{ github.sha }}
          SITE_URL: ${{ vars.SITE_URL }}
          GA_MEASUREMENT_ID: ${{ vars.GA_MEASUREMENT_ID }}
        run: python scripts/build_site.py --output _site

      - name: Check performance budgets
        run: python scripts/check_performance.py _site

      - name: Run browser regression tests
        env:
          SITE_ROOT: _site
        run: python tests/test_browser.py

      - name: Upload visual test artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: visual-test-artifacts
          path: test-results/visual
          if-no-files-found: ignore
          retention-days: 7
